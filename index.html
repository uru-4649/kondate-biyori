<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3b1a9"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>献立日和</title><style>:root{--pink:#df8d89;--cream:#fff9f3;--ink:#58463e;--sage:#799884}*{box-sizing:border-box}body{margin:0;background:#f9f1e9;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;font-size:16px}header{padding:20px 18px 12px;background:linear-gradient(135deg,#fffaf5,#f9e1d7);text-align:center}h1{margin:0;font-size:27px;letter-spacing:.14em}header p{margin:6px;font-size:12px;color:#896f65}main{max-width:640px;margin:auto;padding:14px 14px 100px}.panel{background:#fffdfa;border:1px solid #f0e2d7;border-radius:19px;padding:16px;margin-bottom:14px;box-shadow:0 3px 13px #80604b0c}h2{font-size:19px;margin:0 0 13px}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;background:#f5e5dd;color:#5a443b;padding:11px 13px;cursor:pointer;font-weight:600}button.primary{background:var(--pink);color:white}button.sage{background:#e0ece3;color:#496a55}button:disabled{opacity:.45}input,select,textarea{width:100%;padding:11px;border:1px solid #decfc5;border-radius:11px;background:white;color:#45382f;min-width:0}textarea{min-height:90px}label{display:block;font-size:14px;margin:12px 0 5px;font-weight:600}.row{display:flex;align-items:center;gap:8px}.row>*{min-width:0}.grow{flex:1}.stack{display:grid;gap:9px}.day{border-bottom:1px solid #f1e6df;padding:11px 0}.day:last-child{border:0}.dayhead{display:flex;align-items:center;gap:10px;margin-bottom:7px}.badge{background:#fbe5e1;border-radius:20px;padding:5px 10px;font-size:13px;white-space:nowrap}.small{font-size:13px;color:#89756b}.muted{color:#a28e83}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border-radius:30px;padding:7px 11px;font-size:14px;background:#f6eee6}.chip.on{background:#d9e9dc;color:#395e45}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.hidden{display:none!important}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fffaf6;border-top:1px solid #ecd9cf;padding:7px 4px max(8px,env(safe-area-inset-bottom));z-index:2}nav button{flex:1;max-width:130px;padding:8px 2px;background:transparent;font-size:12px}nav button.active{color:#b75d60;background:#fce7e4}.recipe{padding:12px 0;border-bottom:1px solid #f1e6df}.recipe:last-child{border:0}.title{font-weight:700;font-size:17px}.notice{background:#f3f6ec;padding:11px;border-radius:12px;font-size:13px}.modal{position:fixed;inset:0;background:#33282090;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.dialog{background:#fffaf6;border-radius:20px;padding:20px;width:min(100%,540px);max-height:88vh;overflow:auto}.danger{color:#a63b46}.right{margin-left:auto}.divider{height:1px;background:#f0e2d7;margin:14px 0}a{color:#ae6668;overflow-wrap:anywhere}.thumb{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#f7e9dd}.footer{text-align:center;color:#a18a80;font-size:12px;margin:25px 0}</style></head><body><header><h1>🌷 献立日和</h1><p>今日のごはん、ちょっとラクに、もっと楽しく。</p></header><main><section id="home"><div class="panel"><div class="row"><button onclick="moveWeek(-1)">‹ 前週</button><div class="grow" style="text-align:center;font-weight:700" id="weekLabel"></div><button onclick="moveWeek(1)">次週 ›</button></div><div id="days"></div><div class="actions"><button class="primary" onclick="generate()">🍲 1週間の献立を提案</button><button onclick="go('recipes')">📖 レシピ帳</button></div><p class="small">登録した料理から提案します。決めた献立はいつでも変更できます。</p></div><div class="panel"><h2>✨ おまかせ条件</h2><div class="chips" id="conditionChips"></div><label>同じ料理をなるべく避ける期間</label><select id="avoid" onchange="state.avoid=+this.value;save()"><option value="7">1週間</option><option value="14">2週間</option><option value="30">1か月</option></select></div></section><section id="recipes" class="hidden"><div class="panel"><div class="row"><h2 class="grow">📖 レシピ帳</h2><button class="primary" onclick="editRecipe()">＋ 料理を登録</button></div><input id="recipeSearch" placeholder="料理名・材料で検索" oninput="renderRecipes()"><div id="recipeList"></div></div></section><section id="stock" class="hidden"><div class="panel"><h2>🥕 冷蔵庫の食材</h2><div class="row"><input id="stockInput" placeholder="例：鶏肉、玉ねぎ、じゃがいも"><button class="primary" onclick="addStock()">追加</button></div><p class="small">「、」や「,」でまとめて登録できます。</p><div id="stockChips" class="chips"></div><div class="divider"></div><h2>タップで追加</h2><div class="chips" id="commonChips"></div></div><div class="panel"><h2>🍽️ 今ある食材で作れる料理</h2><div id="matches"></div></div></section><section id="more" class="hidden"><div class="panel"><h2>⚙️ 設定・データ保存</h2><p class="notice">データはこの端末のブラウザ内に保存されます。機種変更・アプリ削除に備えてバックアップを取ってね。お友達のデータとは共有されません。</p><div class="actions"><button class="sage" onclick="backup()">バックアップを保存</button><button onclick="document.getElementById('restoreFile').click()">バックアップを復元</button><input id="restoreFile" class="hidden" type="file" accept="application/json,.json" onchange="restore(event)"></div><p class="small">AIなし・ログインなし。写真はこの端末に保存するため、大きい画像を大量に登録すると容量が不足する場合があります。</p></div></section><div class="footer">Made with ♡ · 献立日和</div></main><nav><button data-tab="home" class="active" onclick="go('home')">🏠<br>献立</button><button data-tab="recipes" onclick="go('recipes')">📖<br>レシピ</button><button data-tab="stock" onclick="go('stock')">🥕<br>食材</button><button data-tab="more" onclick="go('more')">⚙️<br>設定</button></nav><div id="modal" class="modal hidden"><div id="dialog" class="dialog"></div></div><script>
const KEY='kondate_biyori_v1',common=['玉ねぎ','じゃがいも','にんじん','キャベツ','きゅうり','小松菜','ブロッコリー','しめじ','えのき','鶏肉','豚肉','牛肉','鮭','サバ','卵','豆腐','ツナ','ピーマン'];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.recipes))state={recipes:[{id:1,name:'鶏じゃが',ingredients:['鶏肉','じゃがいも','玉ねぎ','にんじん'],steps:'材料を炒めて、だし・しょうゆ・みりんで煮る。',time:30,kind:'main'},{id:2,name:'サバの塩焼き',ingredients:['サバ'],steps:'サバに塩をふって焼く。',time:20,kind:'main'},{id:3,name:'小松菜炒め',ingredients:['小松菜','しめじ'],steps:'バター・しょうゆ・コンソメ・にんにくで炒める。',time:15,kind:'side'},{id:4,name:'春雨サラダ',ingredients:['春雨','きゅうり'],steps:'春雨をゆで、きゅうりと和える。',time:15,kind:'side'},{id:5,name:'カレー',ingredients:['鶏肉','玉ねぎ','じゃがいも','にんじん','カレールー'],steps:'具材を煮込み、ルーを溶かす。',time:40,kind:'main'},{id:6,name:'ポテトサラダ',ingredients:['じゃがいも','きゅうり'],steps:'じゃがいもをゆで、マヨネーズなどで和える。',time:20,kind:'side'}],stock:[],plans:{},avoid:14,conditions:[]};state.stock??=[];state.plans??={};state.conditions??=[];let offset=0;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('保存容量がいっぱいです。写真を小さくするかバックアップしてください。')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function monday(){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);return d}function moveWeek(n){offset+=n;renderHome()}function go(t){for(const s of ['home','recipes','stock','more'])document.getElementById(s).classList.toggle('hidden',s!==t);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));({home:renderHome,recipes:renderRecipes,stock:renderStock})[t]?.()}function renderHome(){let m=monday(),e=new Date(m);e.setDate(e.getDate()+6);document.getElementById('weekLabel').textContent=`${m.getMonth()+1}/${m.getDate()} 〜 ${e.getMonth()+1}/${e.getDate()}`;document.getElementById('days').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);let key=iso(d),p=state.plans[key]||{};return `<div class="day"><div class="dayhead"><span class="badge">${'月火水木金土日'[i]} ${d.getMonth()+1}/${d.getDate()}</span><span class="small">${esc(p.main||'メイン未定')} ／ ${esc(p.side||'副菜未定')}</span></div><div class="row"><button class="sage" onclick="editDay('${key}')">✎ 献立を編集</button>${p.main||p.side?`<button onclick="usedIngredients('${key}')">🥕 食材を確認</button>`:''}</div></div>`}).join('');document.getElementById('avoid').value=state.avoid||14;let options=['節約','時短','冷蔵庫優先','魚多め'];document.getElementById('conditionChips').innerHTML=options.map(x=>`<button class="chip ${state.conditions.includes(x)?'on':''}" onclick="toggleCondition('${x}')">${x}</button>`).join('')}function toggleCondition(x){state.conditions=state.conditions.includes(x)?state.conditions.filter(a=>a!==x):[...state.conditions,x];save();renderHome()}function modal(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}function recipeOptions(kind,selected){return `<option value="">選ばない</option>`+state.recipes.filter(r=>r.kind===kind).map(r=>`<option value="${esc(r.name)}" ${r.name===selected?'selected':''}>${esc(r.name)}</option>`).join('')}function editDay(key){let p=state.plans[key]||{};modal(`<h2>🍽️ ${key} の献立</h2><label>メイン</label><select id="dayMain">${recipeOptions('main',p.main)}</select><label>副菜</label><select id="daySide">${recipeOptions('side',p.side)}</select><label>自由入力（メイン）</label><input id="freeMain" placeholder="一覧にない料理を入力" value=""><label>自由入力（副菜）</label><input id="freeSide" placeholder="一覧にない料理を入力"><div class="actions"><button class="primary" onclick="saveDay('${key}')">保存</button><button onclick="closeModal()">キャンセル</button></div>`)}function saveDay(key){let main=document.getElementById('freeMain').value.trim()||document.getElementById('dayMain').value,side=document.getElementById('freeSide').value.trim()||document.getElementById('daySide').value;state.plans[key]={main,side};save();closeModal();renderHome()}function generate(){if(!state.recipes.some(r=>r.kind==='main'))return alert('まずメイン料理をレシピ帳に登録してね。');if(!confirm('この週の献立を提案で上書きしますか？'))return;let m=monday(),used=new Set(),today=new Date();today.setHours(12,0,0,0);let prior=Object.entries(state.plans).filter(([d])=>{let diff=(today-new Date(d+'T12:00:00'))/86400000;return diff>=0&&diff<state.avoid}).flatMap(([,p])=>[p.main,p.side]);function choose(kind){let pool=state.recipes.filter(r=>r.kind===kind),score=r=>{let v=Math.random()*4;if(state.conditions.includes('時短'))v-=r.time/15;if(state.conditions.includes('冷蔵庫優先'))v+=r.ingredients.filter(i=>state.stock.includes(i)).length*3;if(state.conditions.includes('節約'))v+=r.ingredients.filter(i=>state.stock.includes(i)).length*2-r.ingredients.length;if(state.conditions.includes('魚多め')&&/魚|鮭|サバ|さば|ぶり|鯖/.test(r.name+' '+r.ingredients.join(' ')))v+=6;if(used.has(r.name))v-=50;if(prior.includes(r.name))v-=10;return v};return pool.sort((a,b)=>score(b)-score(a))[0]?.name||''}for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);let main=choose('main');if(main)used.add(main);let side=choose('side');if(side)used.add(side);state.plans[iso(d)]={main,side}}save();renderHome()}function usedIngredients(key){let p=state.plans[key]||{},names=[p.main,p.side],ingredients=[...new Set(state.recipes.filter(r=>names.includes(r.name)).flatMap(r=>r.ingredients))].filter(x=>state.stock.includes(x));if(!ingredients.length)return alert('この献立で使う登録済みの食材はありません。');modal(`<h2>🥕 使い切った食材は？</h2><p class="small">チェックしたものだけ冷蔵庫から削除します。</p>${ingredients.map((x,i)=>`<label><input type="checkbox" class="used" value="${i}" style="width:auto"> ${esc(x)}</label>`).join('')}<div class="actions"><button class="primary" onclick="finishUsed(${JSON.stringify(ingredients).replace(/"/g,'&quot;')})">チェックしたものを削除</button><button onclick="closeModal()">あとで</button></div>`)}function finishUsed(items){document.querySelectorAll('.used:checked').forEach(el=>state.stock=state.stock.filter(s=>s!==items[+el.value]));save();closeModal();renderStock()}function renderRecipes(){let q=(document.getElementById('recipeSearch').value||'').toLowerCase();document.getElementById('recipeList').innerHTML=state.recipes.filter(r=>(r.name+' '+r.ingredients.join(' ')).toLowerCase().includes(q)).map(r=>`<div class="recipe"><div class="row">${r.photo?`<img class="thumb" src="${r.photo}" alt="">`:''}<div class="grow"><div class="title">${esc(r.name)}</div><div class="small">${r.kind==='side'?'副菜':'メイン'} · 約${r.time||'?'}分</div><div class="small">${esc(r.ingredients.join('、'))}</div></div><button onclick="editRecipe(${r.id})">編集</button></div></div>`).join('')||'<p class="small">料理が見つかりません。</p>'}function editRecipe(id){let r=state.recipes.find(x=>x.id===id)||{name:'',ingredients:[],steps:'',time:20,kind:'main',link:'',photo:''};modal(`<h2>📖 ${id?'レシピを編集':'料理を登録'}</h2><label>料理名</label><input id="rName" value="${esc(r.name)}"><label>種類</label><select id="rKind"><option value="main" ${r.kind==='main'?'selected':''}>メイン</option><option value="side" ${r.kind==='side'?'selected':''}>副菜</option></select><label>材料（「、」区切り）</label><textarea id="rIngredients">${esc(r.ingredients.join('、'))}</textarea><label>作り方</label><textarea id="rSteps">${esc(r.steps)}</textarea><label>調理時間（分）</label><input id="rTime" type="number" min="1" value="${r.time||20}"><label>レシピサイトのリンク（任意）</label><input id="rLink" type="url" value="${esc(r.link||'')}"><label>写真（任意）</label><input id="rPhoto" type="file" accept="image/*"><div class="actions"><button class="primary" onclick="saveRecipe(${id||0})">保存</button>${id?`<button class="danger" onclick="deleteRecipe(${id})">削除</button>`:''}<button onclick="closeModal()">戻る</button></div>${r.link?`<p><a href="${esc(r.link)}" target="_blank" rel="noopener">レシピサイトを開く ↗</a></p>`:''}`)}function split(s){return [...new Set(s.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean))]}async function saveRecipe(id){let name=document.getElementById('rName').value.trim();if(!name)return alert('料理名を入れてね');let old=state.recipes.find(r=>r.id===id),file=document.getElementById('rPhoto').files[0],photo=old?.photo||'';if(file){photo=await new Promise(resolve=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,480/img.width,480/img.height);c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.7))};img.src=url})}let r={id:id||Date.now(),name,kind:document.getElementById('rKind').value,ingredients:split(document.getElementById('rIngredients').value),steps:document.getElementById('rSteps').value,time:+document.getElementById('rTime').value||20,link:document.getElementById('rLink').value.trim(),photo};if(old)Object.assign(old,r);else state.recipes.push(r);save();closeModal();renderRecipes()}function deleteRecipe(id){if(!confirm('このレシピを削除しますか？'))return;state.recipes=state.recipes.filter(r=>r.id!==id);save();closeModal();renderRecipes()}function addStock(){let inp=document.getElementById('stockInput');state.stock=[...new Set([...state.stock,...split(inp.value)])];inp.value='';save();renderStock()}function toggleStock(s){state.stock=state.stock.includes(s)?state.stock.filter(x=>x!==s):[...state.stock,s];save();renderStock()}function renderStock(){document.getElementById('stockChips').innerHTML=state.stock.map(s=>`<button class="chip on" onclick="toggleStock('${esc(s).replace(/'/g,'&#39;')}')">${esc(s)} ×</button>`).join('')||'<span class="small">まだ登録されていません</span>';document.getElementById('commonChips').innerHTML=common.map(s=>`<button class="chip ${state.stock.includes(s)?'on':''}" onclick="toggleStock('${s}')">${s}${state.stock.includes(s)?' ✓':''}</button>`).join('');let ranked=state.recipes.map(r=>({...r,missing:r.ingredients.filter(x=>!state.stock.includes(x))})).sort((a,b)=>a.missing.length-b.missing.length);document.getElementById('matches').innerHTML=ranked.map(r=>`<div class="recipe"><div class="title">${esc(r.name)}</div><div class="small">${r.missing.length===0?'✅ 材料がそろっています':`あと${r.missing.length}品：${esc(r.missing.join('、'))}`}</div></div>`).join('')}function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`献立日和_バックアップ_${iso(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(ev){let f=ev.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.recipes)||!Array.isArray(obj.stock)||!obj.plans||typeof obj.plans!=='object')throw Error();if(!confirm('今のデータをバックアップの内容で置き換えますか？'))return;state=obj;save();go('home');alert('復元しました')}catch(e){alert('正しいバックアップファイルを選んでね')}finally{ev.target.value=''}}renderHome();</script></body></html>
